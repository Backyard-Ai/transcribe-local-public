# Proposes updates when a package or GitHub Action has a newer or patched version.
# Each proposal arrives as a pull request and runs the tests. Nothing changes until it's merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # The transcription libraries are tested together on real graphics cards. Update them on
      # purpose, not automatically, because a change can alter transcripts.
      - dependency-name: ctranslate2
      - dependency-name: faster-whisper
      # NVIDIA's graphics libraries do the card's arithmetic, so a change can alter transcripts
      # or speed. They also have to suit CTranslate2: CUDA 12 only, and CUDA 12.8 or newer for
      # RTX 50 series cards.
      - dependency-name: nvidia-cublas-cu12
      - dependency-name: nvidia-cudnn-cu12
      - dependency-name: nvidia-cuda-runtime-cu12
      # Runs the voice detector, so a change can alter which speech gets transcribed.
      - dependency-name: onnxruntime
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
