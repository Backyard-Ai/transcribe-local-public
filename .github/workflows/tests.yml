# Runs the automated tests on Windows for every push and pull request.
# It uses no recordings and no model: the tests use made-up audio and stand-ins for the model.
name: Tests

on:
  push:
    # Dependabot's branches are tested once, through their pull request.
    branches-ignore: ["dependabot/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Exactly what setup installs, including NVIDIA's graphics libraries, so a test can check
          # they land where the program looks for them. No graphics card is needed.
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          # Fails if any two packages disagree about versions.
          python -m pip check
      - name: Run tests
        shell: pwsh
        run: |
          $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
          python -m pytest -q
