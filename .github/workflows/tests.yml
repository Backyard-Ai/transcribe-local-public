# Runs the automated tests on Windows for every push and pull request.
# It uses no recordings and no model: the tests use made-up audio and stand-ins for the model.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # The processor-only build of the same PyTorch version: much smaller, and no graphics card is needed.
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^(torch==|--extra-index-url)' } | Set-Content ci-requirements.txt
          python -m pip install -r ci-requirements.txt
          python -m pip install -e . --no-deps
      - name: Run tests
        shell: pwsh
        run: |
          $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
          python -m pytest -q
