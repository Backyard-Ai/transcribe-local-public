[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-local"
version = "0.1.1"
description = "Offline transcription of research interviews and focus groups for MAXQDA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "numpy",
    "python-docx",
    "soundfile",
    # NVIDIA's graphics libraries for CTranslate2 (see cuda_libraries.py).
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
]

[project.optional-dependencies]
dev = ["huggingface_hub", "pytest"]

[project.scripts]
transcribe-local = "transcribe_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
